<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Bodega Automotriz - Instituto Técnico Industrial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 95%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultado {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            background-color: #e9ecef;
            color: #155724;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <h2>Instituto Técnico Industrial</h2>
    <p style="text-align: center; color: #666;">Sistema de Control e Inventario de Bodega Automotriz</p>

    <form id="formBienvenida">
        <div class="form-group">
            <label for="nombre">Ingrese su nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Víctor" required>
        </div>
        <button type="submit">Consultar Bienvenida</button>
    </form>

    <div id="resultado"></div>

    <script>
        document.getElementById('formBienvenida').addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            
            fetch(`/api/bienvenida?nombre=${encodeURIComponent(nombre)}`)
                .then(response => response.text())
                .then(data => {
                    const divResultado = document.getElementById('resultado');
                    divResultado.innerText = data;
                    divResultado.style.display = 'block';
                })
                .catch(error => {
                    console.error('Error al llamar al endpoint:', error);
                });
        });
    </script>

</body>
</html>
