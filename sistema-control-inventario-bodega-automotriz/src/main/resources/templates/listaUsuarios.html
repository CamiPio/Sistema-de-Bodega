<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Usuarios Registrados - Bodega Automotriz</title>
  
  <link rel="stylesheet" th:href="@{/barraMenu.css}" />
  <link rel="stylesheet" th:href="@{/styles.css}" />

  <style>
    body {
      background-color: #f4f6f9; 
      color: #333; 
      margin: 0; 
      padding: 0; 
      font-family: 'Poppins', sans-serif;
    }
    main {
      width: 96%; /* Ocupa casi el total de la pantalla de forma fluida */
      max-width: 100%; 
      margin: 20px auto; 
      background: white; 
      color: black; 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      box-sizing: border-box;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    select, .boton-rol {
      padding: 6px;
      margin: 2px;
    }
  </style>
</head>
<body>

  <!-- Inserción de la barra de menú global -->
  <div th:replace="barraMenu :: menu"></div>

  <main>
    <h1 style="color: #007bff; margin-bottom: 10px;">Usuarios Registrados en el Sistema</h1>
    <p>Total de usuarios: <strong th:text="${total}">0</strong></p>
    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p th:if="${errorRol}" th:text="${errorRol}" role="alert"></p>
    <p th:if="${errorUsuario}" th:text="${errorUsuario}" role="alert"></p>

    <p th:if="${total == 0}" style="margin-top: 20px; color: #666;">Todavía no hay usuarios registrados.</p>

    <table th:if="${total > 0}">
      <thead>
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Correo Electrónico</th>
          <th>Rol</th>
          <th style="text-align: center;">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="u, estado : ${usuarios}">
          <td style="text-align: center;" th:text="${estado.count}">1</td>
          <td th:text="${u.nombre}">Nombre</td>
          <td th:text="${u.apellido}">Apellido</td>
          <td th:text="${u.correo}">correo@ejemplo.com</td>
          <td>
            <form th:action="@{/usuarios/{id}/rol(id=${u.id})}" method="post">
              <select name="rol" aria-label="Rol del usuario">
                <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}"
                        th:selected="${rol == u.rol}"></option>
              </select>
              <button class="boton-rol" type="submit">Guardar rol</button>
            </form>
          </td>
          <td style="text-align: center;">
            <a th:href="@{/usuarios/detalle/{correo}(correo=${u.correo})}" style="color: #007bff; text-decoration: none; font-weight: bold;">Ver</a>
            <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" style="color: #007bff; text-decoration: none; font-weight: bold; margin-left: 8px;">Editar</a>
            <form th:action="@{/usuarios/eliminar/{id}(id=${u.id})}" method="post" style="display: inline;"
                  onsubmit="return confirm('¿Eliminar este usuario?');">
              <button type="submit">Eliminar</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>

    <p style="margin-top: 30px;">
      <a th:href="@{/login}" style="background-color: #0056b3; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; display: inline-block; font-weight: bold;">Regresar al Login / Registro</a>
    </p>
  </main>

</body>
</html>
