<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra de Menú</title>

    <!-- CAMBIA ESTA LÍNEA EXACTAMENTE ASÍ: -->
    <link rel="stylesheet" th:href="@{/barraMenu.css}">
</head>
<body>

    <!-- Definimos un fragmento llamado 'menu' para reutilizarlo en otras vistas -->
    <div th:fragment="menu" class="menu-global">
        <nav class="barra-menu">
            <div class="contenedor-menu">
                
                <a href="#" class="logo">
                    <!-- Logo de la bodega -->
                </a>

                <ul class="accesos-directos" id="accesosDirectos">
                    <!-- Enlaces apuntando a los endpoints de tus controladores en Spring Boot -->
                    <li><a th:href="@{/catalogo}">Catálogo</a></li>
                    <!-- Acciones para los recursos -->
                    <li style="position: relative;">
                        <button id="opRecurso" type="button" aria-expanded="false" aria-controls="listaRecurso">Acciones</button>
                        <div id="listaRecurso" class="lista-perfil">
                            <a th:if="${session.usuarioRol != 'ADMIN'}" th:href="@{/prestamos}">Mis préstamos</a>
                            <a th:if="${session.usuarioRol != 'ADMIN'}" th:href="@{/catalogo#herramientas}">Realizar préstamo</a>
                            <a th:if="${session.usuarioRol == 'ADMIN'}" th:href="@{/prestamos}">Solicitudes y préstamos</a>
                            <a th:if="${session.usuarioRol == 'ADMIN'}" th:href="@{/prestamos/nuevo}">Registrar préstamo a persona</a>
                            <a th:if="${session.usuarioRol == 'ADMIN'}" th:href="@{/usuarios/lista}">Lista de Usuarios</a>
                        </div>
                    </li>

                    <!-- Lista dentro de Perfil -->
                    <li style="position: relative;">
                        <button id="opPerfil" type="button" aria-expanded="false" aria-controls="listaPerfil">Perfil</button>
                        <div id="listaPerfil" class="lista-perfil">
                            <a th:href="@{/perfil}">Editar mi perfil</a>
                            <form th:action="@{/auth/logout}" method="post">
                                <button type="submit">Cerrar Sesión</button>
                            </form>
                        </div>
                    </li>
                </ul>

                <!-- Barra de búsqueda -->
                <form class="contenedor-busqueda" th:action="@{/catalogo}" method="get" role="search">
                    <input type="search" name="q" th:value="${busqueda}" placeholder="Buscar herramientas..."
                           aria-label="Buscar herramientas" maxlength="100">
                    <button id="buscarBtn" type="submit" aria-label="Buscar"><i class="fas fa-search"></i></button>
                </form>

                <a class="boton-notificaciones notificaciones-superior"
                   th:if="${session.usuarioRol == 'ADMIN'}" th:href="@{/prestamos#solicitudes}"
                   th:attr="aria-label=${solicitudesPendientesCount + ' solicitudes pendientes'}"
                   title="Solicitudes pendientes">
                    <i class="fas fa-bell" aria-hidden="true"></i>
                    <span class="contador-notificaciones" th:if="${solicitudesPendientesCount > 0}"
                          th:text="${solicitudesPendientesCount}">0</span>
                </a>
                <span class="notificaciones-placeholder" th:unless="${session.usuarioRol == 'ADMIN'}"
                      aria-hidden="true"></span>

                <button class="boton-menu" id="menuBtn" type="button" aria-expanded="false" aria-controls="accesosDirectos" aria-label="Abrir menú de navegación">
                    ☰
                </button>
            </div>
        </nav>
        <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous" defer></script>
        <script th:src="@{/barraMenu.js}" defer></script>
    </div>
</body>
</html>
