<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi perfil - Bodega Automotriz</title>
  <link rel="stylesheet" th:href="@{/barraMenu.css}" />
  <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
  <div th:replace="barraMenu :: menu"></div>
  <main class="card-formulario">
    <h1>Mi perfil</h1>
    <p th:if="${mensajePerfil}" th:text="${mensajePerfil}" role="status"></p>
    <p th:if="${errorPerfil}" th:text="${errorPerfil}" role="alert"></p>
    <form th:action="@{/perfil}" th:object="${usuarioForm}" method="post">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" th:field="*{nombre}" maxlength="100" required />
        <p th:errors="*{nombre}" role="alert"></p>
      </div>

      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input id="apellido" type="text" th:field="*{apellido}" maxlength="100" required />
        <p th:errors="*{apellido}" role="alert"></p>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" th:field="*{correo}" maxlength="254" required />
        <p th:errors="*{correo}" role="alert"></p>
      </div>

      <div class="form-group">
        <label for="contrasena">Nueva contraseña (opcional)</label>
        <input id="contrasena" type="password" th:field="*{contrasena}" minlength="6"
               maxlength="72" autocomplete="new-password" />
        <p th:errors="*{contrasena}" role="alert"></p>
      </div>

      <button type="submit">Guardar cambios</button>
      <p><a th:href="@{/catalogo}">Volver al catálogo</a></p>
    </form>
  </main>
</body>
</html>
