<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editar usuario - Bodega Automotriz</title>
  <link rel="stylesheet" th:href="@{/barraMenu.css}" />
  <link rel="stylesheet" th:href="@{/styles.css}" />
  <link rel="stylesheet" th:href="@{/app.css}" />
</head>
<body class="app-page">
  <div th:replace="barraMenu :: menu"></div>
  <main>
    <h1>Editar usuario</h1>
    <p th:if="${errorUsuario}" th:text="${errorUsuario}" role="alert"></p>
    <form th:action="@{/usuarios/editar/{id}(id=${usuarioId})}" th:object="${usuarioForm}" method="post">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" th:field="*{nombre}" maxlength="100" required />
      <p th:errors="*{nombre}" role="alert"></p>

      <label for="apellido">Apellido</label>
      <input id="apellido" type="text" th:field="*{apellido}" maxlength="100" required />
      <p th:errors="*{apellido}" role="alert"></p>

      <label for="correo">Correo</label>
      <input id="correo" type="email" th:field="*{correo}" maxlength="254" required />
      <p th:errors="*{correo}" role="alert"></p>

      <div class="form-group">
        <label for="contrasena">Nueva contraseña (opcional)</label>
        <div class="password-field">
          <input id="contrasena" type="password" th:field="*{contrasena}" minlength="6" maxlength="72"
                 pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^a-zA-Z0-9\s()\x2d´”`’])[^()\x2d´”`’]{6,72}"
                 data-password-policy aria-describedby="mensajeReglaContrasenaEdicion"
                 autocomplete="new-password" />
          <small id="mensajeReglaContrasenaEdicion" class="regla-contrasena" data-password-feedback aria-live="polite"
                 th:classappend="${errorContrasena != null} ? ' error' : ''"
                 th:text="${errorContrasena} ?: ''"></small>
        </div>
        <label class="mostrar-contrasena">
          <input type="checkbox" data-password-toggle="contrasena" />
          Mostrar contraseña
        </label>
      </div>
      <button type="submit">Guardar cambios</button>
      <a th:href="@{/usuarios/lista}">Cancelar</a>
    </form>
  </main>
  <script th:src="@{/password-toggle.js}" defer></script>
  <script th:src="@{/password-validation.js}" defer></script>
</body>
</html>
