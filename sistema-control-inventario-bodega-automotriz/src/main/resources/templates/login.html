<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión / Registro - Bodega Automotriz</title>

    <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Usamos la etiqueta th:href para enlazar correctamente los estilos estáticos de Spring Boot -->
    <link rel="stylesheet" th:href="@{/login.css}" />
</head>
<body>

    <div class="contenedor">
        
        <!-- CAJA DE INICIO DE SESIÓN -->
        <div class="caja-formulario login">
            <form th:action="@{/auth/login}" th:object="${usuarioLogin}" method="post">
                <h1>Inicio de Sesión</h1>   
                <div class="ingreso-datos">
                    <input type="email" th:field="*{correo}" placeholder="Correo electrónico" required>
                    <svg><i class="fa-solid fa-user"></i></svg>
                 </div>
                
                 <div class="ingreso-datos">
                    <input type="password" th:field="*{contrasena}" placeholder="Contraseña" minlength="6" required>
                    <svg><i class="fa-solid fa-lock"></i></svg>
                </div>

                <input type="submit" value="Ingresar" class="boton">
            </form>            
        </div>

        <!-- CAJA DE REGISTRO DE USUARIO (Conectado con tu modelo Usuario.java) -->
        <div class="caja-formulario registro">
            <form th:action="@{/auth/registrar}" th:object="${usuarioRegistro}" method="post">
                <h1>Registro de Usuario</h1>   
                
                <div class="ingreso-datos">
                    <input type="email" th:field="*{correo}" placeholder="Correo electrónico" required>
                    <svg><i class="fa-solid fa-envelope"></i></svg>
                 </div>

                 <div class="ingreso-datos">
                    <input type="text" th:field="*{nombre}" placeholder="Nombre" required>
                    <svg><i class="fa-solid fa-user"></i></svg>
                 </div>

                 <div class="ingreso-datos">
                    <input type="text" th:field="*{apellido}" placeholder="Apellido" required>
                    <svg><i class="fa-solid fa-user"></i></svg>
                 </div>
                
                 <div class="ingreso-datos">
                    <input type="password" th:field="*{contrasena}" placeholder="Contraseña (Mín. 6 caracteres)" minlength="6" required>
                    <svg><i class="fa-solid fa-lock"></i></svg>
                </div>

                <input type="submit" value="Registrarse" class="boton">
            </form>            
        </div>

        <!-- PANELES LATERALES ANIMADOS -->
        <div class="caja-panel">
            <div class="panel-lateral panel-izquierdo">
                <h1>Sistema de Control de Inventario</h1>
                <p>Inicia sesión para gestionar los repuestos y préstamos de la bodega</p>
                <p>¿Aún no tienes cuenta?</p>
                <button class="boton boton-registro">Regístrate</button>
            </div>
            <div class="panel-lateral panel-derecho">
                <h1>Sistema de Control de Inventario</h1>
                <p>Regístrate para obtener acceso a la plataforma de la bodega</p>
                <p>¿Ya tienes cuenta?</p>
                <button class="boton boton-iniciar">Inicia Sesión</button>
            </div>
        </div>
    </div>

    <!-- Script original para la animación deslizante de los paneles -->
    <script>
        const contenedor = document.querySelector('.contenedor');
        const botonRegistro = document.querySelector('.boton-registro');
        const botonLogin = document.querySelector('.boton-iniciar');

        botonRegistro.addEventListener('click', () => {
            contenedor.classList.add('active');
        });

        botonLogin.addEventListener('click', () => {
            contenedor.classList.remove('active');
        });
    </script>
</body>
</html>
